server {
    listen 8080;  # non-root: no privileged port
    server_name _;

    root /usr/share/nginx/html;

    # nginx's own probe: does not depend on the backend being up.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Same origin for the UI and the API: no CORS, the API stays internal.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri /index.html;
    }
}
