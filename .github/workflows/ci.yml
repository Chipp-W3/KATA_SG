name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the GITHUB_TOKEN can only read the repo.
permissions:
  contents: read

jobs:
  # Required status check on main: do not rename this job.
  checks:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves without notice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip # keyed on the requirements files below
          cache-dependency-path: api/requirements*.txt
      - name: Install API dependencies
        working-directory: api
        run: pip install -r requirements-dev.txt
      - name: Lint
        working-directory: api
        run: ruff check . && ruff format --check .
      - name: Unit tests
        working-directory: api
        run: pytest -q
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2" # same as the workstation
      - name: Terraform format
        run: if [ -d infra ]; then terraform fmt -check -recursive infra; fi
