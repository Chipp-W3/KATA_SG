# Identity of the API pods. Terraform grants it read access to the admin-token
# secret (infra/secrets.tf): no annotation needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  # No `replicas`: owned by the HPA (an apply would otherwise reset it under load).
  strategy:
    rollingUpdate:
      maxUnavailable: 0 # never below current capacity during a rollout
      maxSurge: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          # Hard rule: survive a zone outage. With a soft rule, Autopilot packed
          # every pod on a single node in a single zone.
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: api
      containers:
        - name: api
          image: api # rewritten by kustomize (images:)
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: api-config
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              # Leave time for the endpoint removal to reach the load balancer
              # and nginx before uvicorn receives SIGTERM.
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP # internal only: reached through nginx
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# Managed Prometheus: GKE's collectors scrape /metrics on the API pods.
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: api
spec:
  selector:
    matchLabels:
      app: api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
