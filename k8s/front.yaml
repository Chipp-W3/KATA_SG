apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
spec:
  # No `replicas`: owned by the HPA (an apply would otherwise reset it under load).
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      automountServiceAccountToken: false # nginx never calls the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx user of the unprivileged image
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          # Soft: the API rule already brings nodes in two zones, the scheduler then
          # prefers spreading the front over them (not guaranteed: see README limits).
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: front
      containers:
        - name: front
          image: front # rewritten by kustomize (images:)
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp # pid file and proxy temp files
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: front
spec:
  type: LoadBalancer
  loadBalancerIP: 34.52.227.249 # static IP reserved by Terraform (output front_ip)
  selector:
    app: front
  ports:
    - name: http
      port: 80
      targetPort: http
